"0": "蒹葭苍苍，白露为霜。所谓伊人，在水一方。《诗经》"
"1": "昔我往矣，杨柳依依。今我来思，雨雪霏霏。《诗经》"
"2": "行道迟迟，载渴载饥。我心伤悲，莫知我哀！《诗经》"
"3": "芳与泽其杂糅兮，唯昭质其犹未亏。战国·屈原"
"45": "捐余袂兮江中，遗余褋兮澧浦。战国·屈原"
"4": "东临碣石，以观沧海。水何澹澹，山岛耸峙。汉·曹操"
"5": "老骥伏枥，志在千里。烈士暮年，壮心不已。汉·曹操"
"6": "对酒当歌，人生几何！譬如朝露，去日苦多。汉·曹操"
"7": "月明星稀，乌鹊南飞。绕树三匝，何枝可依？汉·曹操"
"8": "孔雀东南飞，五里一徘徊。汉乐府"
"9": "中有双飞鸟，自名为鸳鸯。仰头相向鸣，夜夜达五更。汉乐府"
"64": "百川东到海，何时复西归？少壮不努力，老大徒伤悲！汉乐府"
"10": "不惜歌者苦，但伤知音稀。愿为双鸿鹄，奋翅起高飞。《古诗十九首》"
"11": "馨香盈怀袖，路远莫致之。此物何足贵，但感别经时。《古诗十九首》"
"65": "抗罗袂以掩涕兮，泪流襟之浪浪。悼良会之永绝兮，哀一逝而异乡。三国·曹植"
"12": "君子死知己，提剑出燕京；素骥鸣广陌，慷慨送我行。晋·陶渊明"
"13": "朔气传金柝，寒光照铁衣。将军百战死，壮士十年归。《木兰诗》"
"14": "潜虬媚幽姿，飞鸿响远音。薄霄愧云浮，栖川怍渊沉。南北朝·谢灵运"
"15": "含歌揽涕恒抱愁，人生几时得为乐。南北朝·鲍照"
"16": "前不见古人，后不见来者。唐·陈子昂"
"17": "春江潮水连海平，海上明月共潮生。唐·张若虚"
"18": "江畔何人初见月，江月何年初照人？唐·张若虚"
"19": "此时相望不相闻，愿逐月华流照君。唐·张若虚"
"20": "不知乘月几人归，落月摇情满江树。唐·张若虚"
"79": "云销雨霁，彩彻区明。落霞与孤鹜齐飞，秋水共长天一色。唐·王勃"
"80": "非谢家之宝树，接孟氏之芳邻。他日趋庭，叨陪鲤对；今兹捧袂，喜托龙门。唐·王勃"
"21": "闲来垂钓碧溪上，忽复乘舟梦日边。唐·李白"
"22": "扪参历井仰胁息，以手抚膺坐长叹。唐·李白"
"23": "安能摧眉折腰事权贵，使我不得开心颜？唐·李白"
"58": "古来圣贤皆寂寞，惟有饮者留其名。唐·李白"
"59": "抽刀断水水更流，举杯消愁愁更愁。唐·李白"
"60": "青冥浩荡不见底，日月照耀金银台。唐·李白"
"66": "云想衣裳花想容，春风拂槛露华浓。唐·李白"
"24": "安得广厦千万间，大庇天下寒士俱欢颜。唐·杜甫"
"25": "万里悲秋常作客，百年多病独登台。唐·杜甫"
"54": "出师未捷身先死，长使英雄泪满襟。唐·杜甫"
"55": "丛菊两开他日泪，孤舟一系故园心。唐·杜甫"
"56": "千载琵琶作胡语，分明怨恨曲中论。唐·杜甫"
"57": "尔曹身与名俱灭，不废江河万古流。唐·杜甫"
"26": "国破山河在，城春草木深。感时花溅泪，恨别鸟惊心。唐·杜甫"
"27": "同是天涯沦落人，相逢何必曾相识！唐·白居易"
"28": "轻拢慢捻抹复挑，初为霓裳后六幺。唐·白居易"
"29": "座中泣下谁最多？江州司马青衫湿。唐·白居易"
"30": "渔阳鼙鼓动地来，惊破霓裳羽衣曲。唐·白居易"
"67": "在天愿作比翼鸟，在地愿为连理枝。唐·白居易"
"68": "可怜九月初三夜，露似真珠月似弓。唐·白居易"
"31": "沉舟侧畔千帆过，病树前头万木春。唐·刘禹锡"
"32": "云横秦岭家何在？雪拥蓝关马不前。唐·韩愈"
"69": "山红涧碧纷烂漫，时见松枥皆十围。唐·韩愈"
"70": "鹿门月照开烟树，忽到庞公栖隐处。唐·孟浩然"
"33": "十二门前融冷光，二十三丝动紫皇。唐·李贺"
"52": "南朝四百八十寺，多少楼台烟雨中。唐·杜牧"
"53": "春风十里扬州路，卷上珠帘总不如。唐·杜牧"
"34": "锦瑟无端五十弦，一弦一柱思华年。唐·李商隐"
"35": "此情可待成追忆，只是当时已惘然。唐·李商隐"
"36": "相见时难别亦难，东风无力百花残。唐·李商隐"
"49": "如何四纪为天子，不及卢家有莫愁。唐·李商隐"
"50": "隔座送钩春酒暖，分曹射覆蜡灯红。唐·李商隐"
"51": "春心莫共花争发，一寸相思一寸灰！唐·李商隐"
"61": "晨起动征铎，客行悲故乡。鸡声茅店月，人迹板桥霜。唐·温庭筠"
"62": "云边雁断胡天月，陇上羊归塞草烟。唐·温庭筠"
"37": "问君能有几多愁，恰似一江春水向东流。五代·李煜"
"38": "多情自古伤离别，更那堪，冷落清秋节。宋·柳永"
"39": "今宵酒醒何处？杨柳岸，晓风残月。宋·柳永"
"71": "衣带渐宽终不悔，为伊消得人憔悴。宋·柳永"
"40": "多情应笑我，早生华发。人生如梦，一尊还酹江月。宋·苏轼"
"41": "东风知我欲山行，吹断檐间积雨声。宋·苏轼"
"42": "但愿人长久，千里共婵娟。宋·苏轼"
"43": "千古江山，英雄无觅孙仲谋处。舞榭歌台，风流总被雨打风吹去。宋·辛弃疾"
"44": "欲说还休，欲说还休，却道天凉好个秋。宋·辛弃疾"
"76": "八百里分麾下炙，五十弦翻塞外声，沙场秋点兵。宋·辛弃疾"
"77": "休说鲈鱼堪脍，尽西风，季鹰归未？宋·辛弃疾"
"78": "求田问舍，怕应羞见，刘郎才气。宋·辛弃疾"
"46": "生当作人杰，死亦为鬼雄。至今思项羽，不肯过江东。宋·李清照"
"47": "寻寻觅觅，冷冷清清，凄凄惨惨戚戚。乍暖还寒时候，最难将息。宋·李清照"
"48": "三杯两盏淡酒，怎敌他、晚来风急！雁过也，正伤心，却是旧时相识。宋·李清照"
"63": "孤村落日残霞，轻烟老树寒鸦，一点飞鸿影下。元·白朴"
"72": "一声梧叶一声秋，一点芭蕉一点愁，三更归梦三更后。元·徐再思"
"73": "滚滚长江东逝水，浪花淘尽英雄。是非成败转头空。明·杨慎"
"74": "看万山红遍，层林尽染；漫江碧透，百舸争流。《沁园春·长沙》"
"75": "恰同学少年，风华正茂；书生意气，挥斥方遒。《沁园春·长沙》"